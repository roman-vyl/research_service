[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data_engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "pydantic-settings",
  "pybit",
  "tenacity",
  "typer",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
research = ["numpy>=1.24", "pandas>=2.1", "PyYAML", "vectorbt>=0.26"]
workbench-api = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "httpx>=0.27"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["data_engine*", "research*", "research_api*"]

[tool.pytest.ini_options]
# Workbench BFF tests: pip install -e ".[dev,workbench-api]"
markers = [
    "optional_vectorbt: requires the project research extra (vectorbt)",
    "workbench_api: requires the workbench-api extra (fastapi, httpx); install with pip install -e \".[dev,workbench-api]\"",
    "workbench_market: market API tests in tests/test_research_api_market.py",
]
